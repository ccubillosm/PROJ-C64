<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COM-011: Juego del Gato - VIC-II Mockup (C64)</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/c64');

        body {
            background-color: #111;
            color: #fff;
            font-family: 'C64', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .notice {
            background: #333;
            color: #ff0;
            padding: 8px 16px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px dashed #ff0;
            text-align: center;
        }

        /* Contenedor simulando el borde y pantalla VIC-II del C64 */
        .c64-border {
            background-color: #352879; /* Azul borde C64 */
            padding: 24px;
            border: 4px solid #6c5eb5;
            box-shadow: 0 0 30px rgba(53, 40, 121, 0.8);
        }

        .c64-screen {
            background-color: #000000; /* Fondo negro VIC-II */
            width: 640px;
            height: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: repeat(25, 1fr);
            grid-template-columns: repeat(40, 1fr);
            font-family: 'C64', monospace;
            font-size: 14px;
            line-height: 1;
            position: relative;
        }

        /* Colores PETSCII simulados */
        .c-white { color: #ffffff; }
        .c-cyan { color: #7abfc7; }
        .c-green { color: #35a535; }
        .c-red { color: #a53535; }
        .c-yellow { color: #d8ac27; }
        .c-blue { color: #3535a5; }

        .row-span-full { grid-column: 1 / 41; }
        
        .header {
            grid-column: 1 / 41;
            grid-row: 1 / 3;
            text-align: center;
            font-weight: bold;
        }

        .board-container {
            grid-column: 12 / 29;
            grid-row: 6 / 16;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background-color: #7abfc7;
            padding: 4px;
        }

        .cell {
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background-color: #222266;
        }

        .sidebar {
            grid-column: 31 / 40;
            grid-row: 6 / 16;
            border-left: 2px solid #7abfc7;
            padding-left: 10px;
            font-size: 11px;
        }

        .status-bar {
            grid-column: 1 / 41;
            grid-row: 22 / 24;
            border-top: 1px solid #7abfc7;
            padding-top: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="notice">
        [MOCKUP VISUAL DE REFERENCIA] - El código definitivo para producción es 100% MOS 6502 Assembly / C.
    </div>

    <div class="c64-border">
        <div class="c64-screen" id="c64-screen" data-testid="c64-screen-container">
            
            <!-- Cabecera -->
            <div class="header c-cyan" data-testid="c64-title-banner">
                **** COMMODORE 64 TRES EN RAYA ****<br>
                <span class="c-white">PROJ: COM-011 - VIC-II UI</span>
            </div>

            <!-- Tablero de Gato 3x3 -->
            <div class="board-container" data-testid="tictactoe-board">
                <div class="cell c-green" onclick="makeMove(0)" data-testid="board-cell-0-0" id="c0"> </div>
                <div class="cell c-green" onclick="makeMove(1)" data-testid="board-cell-0-1" id="c1"> </div>
                <div class="cell c-green" onclick="makeMove(2)" data-testid="board-cell-0-2" id="c2"> </div>
                <div class="cell c-green" onclick="makeMove(3)" data-testid="board-cell-1-0" id="c3"> </div>
                <div class="cell c-red"   onclick="makeMove(4)" data-testid="board-cell-1-1" id="c4">O</div>
                <div class="cell c-green" onclick="makeMove(5)" data-testid="board-cell-1-2" id="c5"> </div>
                <div class="cell c-green" onclick="makeMove(6)" data-testid="board-cell-2-0" id="c6"> </div>
                <div class="cell c-green" onclick="makeMove(7)" data-testid="board-cell-2-1" id="c7"> </div>
                <div class="cell c-green" onclick="makeMove(8)" data-testid="board-cell-2-2" id="c8"> </div>
            </div>

            <!-- Panel Lateral / Marcador -->
            <div class="sidebar c-yellow" data-testid="sidebar-hud">
                <span class="c-white">HUD STATS</span><br><br>
                P1 (X): <span class="c-green" data-testid="score-p1">01</span><br>
                CPU(O): <span class="c-red" data-testid="score-cpu">00</span><br><br>
                <span class="c-cyan">MODO:</span><br>HUMANO VS CPU
            </div>

            <!-- Barra de Estado Inferior -->
            <div class="status-bar c-white" data-testid="status-message">
                TURNO JUGADOR 1 (X)<br>
                <span class="c-yellow">[F1] NUEVA PARTIDA   [F3] CAMBIAR MODO</span>
            </div>

        </div>
    </div>

    <script>
        let board = ["", "", "", "", "O", "", "", "", ""];
        let turn = "X";

        function makeMove(index) {
            if (board[index] === "") {
                board[index] = turn;
                document.getElementById('c' + index).innerText = turn;
                document.getElementById('c' + index).className = turn === 'X' ? 'cell c-green' : 'cell c-red';
                turn = turn === "X" ? "O" : "X";
                document.querySelector('[data-testid="status-message"]').innerHTML = 
                    `TURNO ${turn === 'X' ? 'JUGADOR 1 (X)' : 'CPU / P2 (O)'}<br><span class="c-yellow">[F1] NUEVA PARTIDA   [F3] CAMBIAR MODO</span>`;
            }
        }
    </script>
</body>
</html>
